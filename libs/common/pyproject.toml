[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blipp-common"
version = "0.1.0"
description = "Shared core infrastructure library for Blipp microservices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "nats-py>=2.9.0",
    "boto3>=1.36.0",
    "redis>=5.0.0",
    "async-timeout>=4.0.3",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["blipp_common*"]
