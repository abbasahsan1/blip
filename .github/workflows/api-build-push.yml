# .github/workflows/api-build-push.yml
#
# Blipps v1 API — Build, tag, and push to Docker Hub on every push to main.
#
# Two tags are always pushed:
#   latest              — always points to the most recent build
#   <short-sha>         — immutable, 7-char git SHA for rollbacks
#
# Required GitHub repo secrets (Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME  — your Docker Hub username (e.g. abbasahsan1)
#   DOCKERHUB_TOKEN     — a Docker Hub Access Token (not your password)
#                         Create at: hub.docker.com → Account Settings
#                         → Personal access tokens → Generate new token
#                         (read/write/delete scope on the target repo)

name: API — Build & Push to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      # Only trigger when the API service or its workflow file changes.
      # Remove this filter if you want every push to trigger a rebuild.
      - "services/api/**"
      - ".github/workflows/api-build-push.yml"

jobs:
  build-and-push:
    name: Build image and push to Docker Hub
    runs-on: ubuntu-latest
    # No continue-on-error — any step failure stops the job loudly.

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Derive the short SHA tag ──────────────────────────────────────
      - name: Set short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # ── 3. Set up Docker Buildx (enables BuildKit, cache mounts) ─────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Login to Docker Hub ────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 5. Build and push ─────────────────────────────────────────────────
      # Both tags are pushed atomically in a single buildx call.
      # context is the services/api subdirectory (contains the Dockerfile).
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/blipps-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/blipps-api:${{ steps.sha.outputs.short }}
          # BuildKit layer cache: reuse cached layers from previous runs
          # to keep dependency install fast (requirements.txt rarely changes)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # ── 6. Confirm push (fail loudly if digest is missing) ───────────────
      - name: Confirm image pushed
        run: |
          echo "Pushed tags:"
          echo "  ${{ secrets.DOCKERHUB_USERNAME }}/blipps-api:latest"
          echo "  ${{ secrets.DOCKERHUB_USERNAME }}/blipps-api:${{ steps.sha.outputs.short }}"

      # ── 7. Trigger Render deploy ──────────────────────────────────────────
      # Render does NOT auto-poll Docker Hub. To automate deploys:
      #   1. Render dashboard → your service → Settings → Deploy Hook → copy URL
      #   2. Add it as GitHub secret: RENDER_DEPLOY_HOOK_URL
      #   3. Uncomment the step below
      #
      # - name: Trigger Render deploy
      #   run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Deploy triggered:', d)"

