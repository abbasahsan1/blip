apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
  namespace: blipp
  labels:
    app.kubernetes.io/name: analytics-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: blipp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: blipp
    spec:
      containers:
        - name: analytics-worker
          image: blipp-analytics-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: blipp-secrets
          env:
            - name: POSTGRES_DB
              value: blipp
            - name: NATS_URL
              value: nats://nats.blipp.svc.cluster.local:4222
            - name: REDIS_URL
              value: redis://redis.blipp.svc.cluster.local:6379/0
            - name: GORSE_API_URL
              value: http://gorse.blipp.svc.cluster.local:8088
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
