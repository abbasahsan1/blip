apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
  namespace: blipp
  labels:
    app.kubernetes.io/name: analytics-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: blipp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: blipp
    spec:
      containers:
        - name: analytics-worker
          image: blipp-analytics-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: blipp-secrets
          env:
            - name: POSTGRES_DB
              value: blipp
            - name: NATS_URL
              value: nats://nats.blipp.svc.cluster.local:4222
            - name: REDIS_URL
              value: redis://redis.blipp.svc.cluster.local:6379/0
            - name: GORSE_API_URL
              value: http://gorse.blipp.svc.cluster.local:8088
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Exec-based probes: analytics-worker has no HTTP server.
          # readinessProbe delays traffic/dependencies until the process is up.
          # livenessProbe restarts the pod if the main process dies unexpectedly.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - kill -0 1
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - kill -0 1
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
