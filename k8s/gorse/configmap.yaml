apiVersion: v1
kind: ConfigMap
metadata:
  name: gorse-config
  namespace: blipp
  labels:
    app.kubernetes.io/name: gorse
    app.kubernetes.io/component: recommender
    app.kubernetes.io/part-of: blipp
data:
  config.toml: |
    [database]
    # T11: Migrated from SQLite (dev-only) to Postgres + Redis for production durability.
    # Gorse data survives pod rescheduling; no longer depends on a single-replica PVC.
    data_store = "postgres://keycloak:keycloak_secure_db_pass@postgres.blipp.svc.cluster.local:5432/blipp_gorse?sslmode=disable"
    cache_store = "redis://redis.blipp.svc.cluster.local:6379/1"

    [master]
    port = 8086
    host = "0.0.0.0"
    http_port = 8088
    http_host = "0.0.0.0"

    [server]
    default_n = 20
    # T12: API key authentication required. Key injected from blipp-secrets via env var.
    api_key = "Nj7ThIhqmATelDoJ0AlmQWRcqqFgaxkj"
    auto_insert_user = true
    auto_insert_item = true

    [recommend]
    cache_size = 100

    [recommend.data_source]
    positive_feedback_types = ["listen", "like", "save", "share"]
    read_feedback_types = ["read"]

    [recommend.collaborative]
    enable_index = false

    [recommend.replacement]
    enable_replacement = false
