apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging
  namespace: blipp
  labels:
    app.kubernetes.io/name: messaging
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: blipp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: messaging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: messaging
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: blipp
    spec:
      containers:
        - name: messaging
          image: blipp-messaging:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8004
          envFrom:
            - secretRef:
                name: blipp-secrets
          env:
            - name: POSTGRES_DB
              value: "blipp_messaging"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
