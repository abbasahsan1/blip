apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcode-worker
  namespace: blipp
  labels:
    app.kubernetes.io/name: transcode-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: blipp
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: transcode-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transcode-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: blipp
    spec:
      containers:
        - name: transcode-worker
          image: blipp-transcode-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: blipp-secrets
          env:
            - name: NATS_URL
              value: nats://nats.blipp.svc.cluster.local:4222
            - name: S3_ENDPOINT_URL
              value: http://minio.blipp.svc.cluster.local:9000
            - name: S3_BUCKET_RAW_UPLOADS
              value: blipp-raw-uploads
            - name: S3_BUCKET_AUDIO_VARIANTS
              value: blipp-audio-variants
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          # Exec-based probes: transcode-worker has no HTTP server.
          # readinessProbe delays traffic/dependencies until the process is up.
          # livenessProbe restarts the pod if the main process dies unexpectedly.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - kill -0 1
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - kill -0 1
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
