apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: blipp-ratelimit
  namespace: blipp
  labels:
    app.kubernetes.io/name: blipp-ingress
    app.kubernetes.io/part-of: blipp
spec:
  rateLimit:
    average: 100
    burst: 50

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-auth
  namespace: blipp
spec:
  stripPrefix:
    prefixes:
      - /auth

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-ingest
  namespace: blipp
spec:
  stripPrefix:
    prefixes:
      - /ingest

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-feed
  namespace: blipp
spec:
  stripPrefix:
    prefixes:
      - /feed

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-social
  namespace: blipp
spec:
  stripPrefix:
    prefixes:
      - /social

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-messages
  namespace: blipp
spec:
  stripPrefix:
    prefixes:
      - /messages

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-moderation
  namespace: blipp
spec:
  stripPrefix:
    prefixes:
      - /moderation

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-minio
  namespace: blipp
spec:
  stripPrefix:
    prefixes:
      - /minio

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-keycloak
  namespace: blipp
spec:
  stripPrefix:
    prefixes:
      - /keycloak

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: blipp-ingress
  namespace: blipp
  labels:
    app.kubernetes.io/name: blipp-ingress
    app.kubernetes.io/part-of: blipp
spec:
  entryPoints:
    - web
  routes:
    # 1. Auth Service (/v1/auth, /api/v1/auth, /auth/v1/auth, /auth)
    - match: PathPrefix(`/v1/auth`) || PathPrefix(`/api/v1/auth`) || PathPrefix(`/auth/v1/auth`)
      kind: Rule
      services:
        - name: auth-service
          port: 8000
    - match: PathPrefix(`/auth`)
      kind: Rule
      middlewares:
        - name: strip-auth
      services:
        - name: auth-service
          port: 8000

    # 2. Content Ingest Service (/ingest, /v1/uploads, /v1/blipps)
    - match: PathPrefix(`/ingest`)
      kind: Rule
      middlewares:
        - name: strip-ingest
      services:
        - name: content-ingest-service
          port: 8001
    - match: PathPrefix(`/v1/uploads`) || PathPrefix(`/v1/blipps`)
      kind: Rule
      services:
        - name: content-ingest-service
          port: 8001

    # 3. Feed Service (/feed, /v1/feed, /v1/events)
    - match: PathPrefix(`/feed`)
      kind: Rule
      middlewares:
        - name: strip-feed
      services:
        - name: feed-service
          port: 8002
    - match: PathPrefix(`/v1/feed`) || PathPrefix(`/v1/events`)
      kind: Rule
      services:
        - name: feed-service
          port: 8002

    # 4. Social Graph Service (/social, /v1/profiles, /v1/social)
    - match: PathPrefix(`/social`)
      kind: Rule
      middlewares:
        - name: strip-social
      services:
        - name: social-graph-service
          port: 8003
    - match: PathPrefix(`/v1/profiles`) || PathPrefix(`/v1/social`)
      kind: Rule
      services:
        - name: social-graph-service
          port: 8003

    # 5. Messaging Service (/messages, /v1/messages, /v1/stories)
    - match: PathPrefix(`/messages`)
      kind: Rule
      middlewares:
        - name: strip-messages
      services:
        - name: messaging-service
          port: 8004
    - match: PathPrefix(`/v1/messages`) || PathPrefix(`/v1/stories`)
      kind: Rule
      services:
        - name: messaging-service
          port: 8004

    # 6. Moderation Service (/moderation, /v1/reports, /v1/moderation)
    - match: PathPrefix(`/moderation`)
      kind: Rule
      middlewares:
        - name: strip-moderation
      services:
        - name: moderation-service
          port: 8005
    - match: PathPrefix(`/v1/reports`) || PathPrefix(`/v1/moderation`)
      kind: Rule
      services:
        - name: moderation-service
          port: 8005

    # 7. MinIO S3 Storage (/minio, /blipp-uploads, /blipp-variants, /blipp-stories)
    - match: PathPrefix(`/minio`)
      kind: Rule
      middlewares:
        - name: strip-minio
      services:
        - name: minio
          port: 9000
    - match: PathPrefix(`/blipp-uploads`) || PathPrefix(`/blipp-variants`) || PathPrefix(`/blipp-stories`)
      kind: Rule
      services:
        - name: minio
          port: 9000

    # 8. Keycloak Identity Provider (/keycloak, /realms, /resources, /js)
    - match: PathPrefix(`/keycloak`)
      kind: Rule
      middlewares:
        - name: strip-keycloak
      services:
        - name: keycloak
          port: 8080
    - match: PathPrefix(`/realms`) || PathPrefix(`/resources`) || PathPrefix(`/js`)
      kind: Rule
      services:
        - name: keycloak
          port: 8080
