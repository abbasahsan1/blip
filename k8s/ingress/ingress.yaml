apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blipp-ingress
  namespace: blipp
  labels:
    app.kubernetes.io/name: blipp-ingress
    app.kubernetes.io/part-of: blipp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # Keycloak Identity Provider
          - path: /keycloak
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080

          # FastAPI Authentication & API Microservice
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8000

          # FastAPI Swagger Documentation
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8000

          # FastAPI Service Health Probe
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8000

          # Expo Web Application (Blipp)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blipp-app
                port:
                  number: 80
