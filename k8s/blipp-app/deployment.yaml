apiVersion: apps/v1
kind: Deployment
metadata:
  name: blipp-app
  namespace: blipp
  labels:
    app.kubernetes.io/name: blipp-app
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: blipp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blipp-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blipp-app
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: blipp
    spec:
      containers:
        - name: blipp-app
          image: blipp-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
