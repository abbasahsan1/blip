apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed
  namespace: blipp
  labels:
    app.kubernetes.io/name: feed
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: blipp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: feed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feed
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: blipp
    spec:
      containers:
        - name: feed
          image: blipp-feed:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - secretRef:
                name: blipp-secrets
          env:
            - name: POSTGRES_DB
              value: "blipp_feed"
            - name: S3_PUBLIC_ENDPOINT_URL
              value: "http://localhost:9000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
